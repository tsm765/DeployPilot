name: DeployPilot CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  demo-app-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install demo app dependencies
        working-directory: demo-app
        run: pip install -r requirements.txt

      - name: Run demo app tests
        working-directory: demo-app
        run: python -m pytest

      - name: Build demo app Docker image
        working-directory: demo-app
        run: docker build -t deploypilot-demo:ci .

  azure-acr-auth:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: az account show --query "{Name:name,State:state}" -o table

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}
